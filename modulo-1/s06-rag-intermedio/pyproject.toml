[project]
name = "s06-rag-intermedio"
version = "0.1.0"
description = "Sesión 6 · RAG intermedio: chunking, recuperación híbrida, reranking y reescritura de consultas"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.0",
    "beautifulsoup4>=4.12",
    "jinja2>=3.1",
    "numpy>=2.0",
    "openai>=1.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pinecone>=7.0",
    "pydantic>=2.8",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "reportlab>=4.2",
]

[tool.uv]
package = false
