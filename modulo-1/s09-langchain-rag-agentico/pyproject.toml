[project]
name = "s09-langchain-rag-agentico"
version = "0.1.0"
description = "Sesión 9 · LangChain: características útiles y RAG agéntico"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain>=1.4",
    "langchain-anthropic>=1.0",
    "langchain-openai>=1.0",
    "langgraph>=1.0",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "nbconvert>=7.16",
]

[tool.uv]
package = false
