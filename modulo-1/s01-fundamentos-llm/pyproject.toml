[project]
name = "s01-fundamentos-llm"
version = "0.1.0"
description = "Sesión 1 · Fundamentos del LLM y ventanas de contexto"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.0",
    "pydantic>=2.8",
    "openai>=1.0",
    "tiktoken>=0.9",
    "tokenizers>=0.21",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
]

[tool.uv]
package = false
