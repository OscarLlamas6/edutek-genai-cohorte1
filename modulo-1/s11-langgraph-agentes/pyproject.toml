[project]
name = "s11-langgraph-agentes"
version = "0.1.0"
description = "Sesión 11 · LangGraph: agentes como grafos"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.163.0",
    "httpx>=0.28.1",
    "langchain>=1.4",
    "langchain-anthropic>=1.0",
    "langchain-openai>=1.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "numpy>=2.0",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "nbconvert>=7.16",
]

[tool.uv]
package = false
