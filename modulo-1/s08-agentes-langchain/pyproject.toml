[project]
name = "s08-agentes-langchain"
version = "0.1.0"
description = "Sesión 8 · Fundamentos de un agente de IA con LangChain"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.0",
    "jinja2>=3.1",
    "langchain>=1.0",
    "langchain-anthropic>=1.0",
    "langchain-openai>=1.0",
    "numpy>=2.0",
    "openai>=1.0",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
]

[tool.uv]
package = false
